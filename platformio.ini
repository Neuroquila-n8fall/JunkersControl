; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = "Project for controlling Junkers heating systems equipped with BM1 and BM2 bus modules"
default_envs = development, production
data_dir = data_build

[env]
# Pin the exact pioarduino platform used for development and release builds.
# The stock PlatformIO espressif32 platform currently resolves to Arduino 2.x,
# which does not provide the APIs required by this firmware.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_raw = yes
lib_deps =
	knolleary/PubSubClient@^2.8
	pierremolinaro/ACAN2515@^2.1.2
	ropg/ezTime@^0.8.3
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	bblanchon/ArduinoJson@^7.4.3
	ESP32Async/AsyncTCP@^3.4.10
	ESP32Async/ESPAsyncWebServer@^3.11.2
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
build_flags =
	-D MCP2515_INT=17
	-D MCP2515_CS=5
	-D MQTT_MAX_PACKET_SIZE=1024
extra_scripts = post:gzip-data.py

[custom]
upload_protocol = espota
upload_port = 10.3.0.6

[env:development]
build_flags =
	${env.build_flags}
	-D ENV=${this.__env__}
	-D MUTE_MQTT=1

[env:development_ota]
upload_protocol = ${custom.upload_protocol}
upload_port = ${custom.upload_port}
monitor_port = socket://${custom.upload_port}:23
build_flags = ${env:development.build_flags}

[env:development_usb]
upload_port = COM3
build_flags = ${env:development.build_flags}

[env:production]
build_flags =
	${env.build_flags}
	-D ENV=${this.__env__}

[env:production_ota]
upload_protocol = ${custom.upload_protocol}
upload_port = ${custom.upload_port}
monitor_port = socket://${custom.upload_port}:23
build_flags =
	${env:production.build_flags}

[env:github]
build_flags =
	${env.build_flags}
	-include version.h
	-D ENV=${this.__env__}
