; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = "Project for controlling Bosch-Junkers heating systems equipped with a BM1 bus module"
default_envs = development, production
data_dir = data_build
build_cache_dir = .pio/build_cache

[env]
# Pin the official ESP32 platform (Arduino 2.0.17).
# Network calls use the portable APIs supported by this core.
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_raw = yes
lib_deps =
	knolleary/PubSubClient@^2.8
	pierremolinaro/ACAN2515@^2.1.2
	ropg/ezTime@^0.8.3
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	bblanchon/ArduinoJson@^7.4.3
	ESP32Async/AsyncTCP@^3.4.10
	ESP32Async/ESPAsyncWebServer@^3.11.2
board_build.filesystem = littlefs
board_build.partitions = partitions_custom.csv
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D MCP2515_INT=17
	-D MCP2515_CS=5
	-D MQTT_MAX_PACKET_SIZE=1024
extra_scripts = post:gzip-data.py
; Keep the JSON-only simulation entry point out of normal firmware images.
build_src_filter = +<*> -<temperature_simulator.cpp>


[custom]
upload_protocol = espota
upload_port = 10.3.0.6

[env:development]
build_flags =
	${env.build_flags}
	-D ENV=${this.__env__}
	-D MUTE_MQTT=1

[env:development_ota]
upload_protocol = ${custom.upload_protocol}
upload_port = ${custom.upload_port}
monitor_port = socket://${custom.upload_port}:23
build_flags = ${env:development.build_flags}

[env:development_usb]
upload_port = COM3
build_flags = ${env:development.build_flags}

[env:production]
build_flags =
	${env.build_flags}
	-D ENV=${this.__env__}

[env:production_ota]
upload_protocol = ${custom.upload_protocol}
upload_port = ${custom.upload_port}
monitor_port = socket://${custom.upload_port}:23
build_flags =
	${env:production.build_flags}

[env:github]
build_flags =
	${env.build_flags}
	-include version.h
	-D ENV=${this.__env__}
[env:temperature_test]
; Unity exercises only the pure calculation on the USB-connected ESP32.
upload_port = COM3
test_port = COM3
test_speed = 115200
test_framework = unity
test_build_src = yes
test_filter = test_temperature
build_src_filter = -<*> +<feed_temperature.cpp>
build_flags = -std=gnu++17
lib_deps =
extra_scripts =

[env:temperature_simulator]
; Interactive JSON simulator: no production setup, CAN, WiFi, MQTT or web code.
upload_port = COM3
build_src_filter = -<*> +<feed_temperature.cpp> +<temperature_simulator.cpp>
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@^7.4.3
extra_scripts =

[env:forecast_test]
; Execute real forecast lifecycle and temperature code with passive CAN/MQTT bindings.
upload_port = COM3
test_port = COM3
test_speed = 115200
test_framework = unity
test_build_src = yes
test_filter = test_forecast
build_src_filter = -<*> +<feed_temperature.cpp> +<forecast.cpp>
build_flags = -std=gnu++17 -include test/forecast_support/context.h
lib_deps =
extra_scripts =
[env:runtime_control_test]
; Exercise the real queued command and forecast/temperature lifecycle without application networking.
upload_port = COM3
test_port = COM3
test_speed = 115200
test_framework = unity
test_build_src = yes
test_filter = test_runtime_controls
build_src_filter = -<*> +<mqtt.cpp> +<forecast.cpp> +<feed_temperature.cpp>
build_flags = -std=gnu++17 -include test/runtime_control_support/context.h -D MUTE_MQTT=1
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.4.3
	milesburton/DallasTemperature@^4.0.6
	paulstoffregen/OneWire@^2.3.8
extra_scripts =
