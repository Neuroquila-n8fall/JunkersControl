name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  create_release:
    name: Build and create draft release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Create version header
        shell: bash
        run: printf '#ifndef VERSION\n#define VERSION %s\n#endif\n' "$RELEASE_TAG" > version.h

      - name: Verify release contains no device configuration
        shell: bash
        run: test ! -e data/configuration.json

      - name: Build production firmware
        run: pio run -e github

      - name: Build production filesystem
        run: pio run -e github -t buildfs

      - name: Verify filesystem staging contains only the configuration template
        shell: bash
        run: cmp assets/Templates/Configurations/configuration.json data_build/configuration.json

      - name: Archive release binaries
        uses: actions/upload-artifact@v4
        with:
          name: JunkersControl-${{ env.RELEASE_TAG }}
          path: |
            .pio/build/github/firmware.bin
            .pio/build/github/littlefs.bin
          if-no-files-found: error

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            ".pio/build/github/firmware.bin#Firmware" \
            ".pio/build/github/littlefs.bin#LittleFS filesystem" \
            --draft \
            --verify-tag \
            --title "Release $RELEASE_TAG" \
            --notes-from-tag
